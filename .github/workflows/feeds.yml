name: Feed RSS

# Rigenera quotidiano/feed.xml e settimanale/feed.xml quando cambiano le edizioni.
on:
  push:
    branches: [main]
    paths:
      - "quotidiano/data/issues.json"
      - "settimanale/data/issues.json"
      - "scripts/feeds.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/feeds.py
      - name: Commit dei feed, se sono cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add quotidiano/feed.xml settimanale/feed.xml
          if git diff --cached --quiet; then echo "Feed invariati"; exit 0; fi
          git commit -m "Aggiorna i feed RSS"
          git pull --rebase origin main
          git push origin HEAD:main
