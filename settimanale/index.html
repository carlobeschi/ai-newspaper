<html lang="it">
<head>
<meta charset="utf-8">

<style>
/* Layout: rivista settimanale. Copertina con foto e sommario, rassegna breve a due colonne,
   approfondimenti in colonna di lettura da ~65 caratteri, commento su fondo tinto. */
:root{
  --paper:#f4f5f2; --paper-2:#e9ebe6; --ink:#16181c; --muted:#5a6068; --rule:#d3d7d0;
  --accent:#0f5a69; --gold:#b9770b; --op-bg:#ece8dc;
  --c-cover:#0f5a69; --c-econ:#b9770b; --c-fin:#2d5d9a; --c-sec:#a8392f; --c-op:#7a5a12; --c-soc:#4f6b3a;
  --on-photo:#ffffff;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-label:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121417; --paper-2:#1a1d21; --ink:#e8e9e5; --muted:#9ba2a9; --rule:#2c3035;
  --accent:#5fb4c4; --gold:#e3a63c; --op-bg:#1d1b16;
  --c-cover:#5fb4c4; --c-econ:#e3a63c; --c-fin:#7fa8e0; --c-sec:#e57a6e; --c-op:#d8b65a; --c-soc:#9cc47e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121417; --paper-2:#1a1d21; --ink:#e8e9e5; --muted:#9ba2a9; --rule:#2c3035;
  --accent:#5fb4c4; --gold:#e3a63c; --op-bg:#1d1b16;
  --c-cover:#5fb4c4; --c-econ:#e3a63c; --c-fin:#7fa8e0; --c-sec:#e57a6e; --c-op:#d8b65a; --c-soc:#9cc47e;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:.82rem}
h1,h2,h3{text-wrap:balance}

/* banda superiore */
.about{border-bottom:1px solid var(--rule);padding-block:10px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.9rem}
.about a{color:var(--accent);text-decoration:none;font-family:var(--f-label);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.85rem}
.about a:hover{text-decoration:underline}

/* testata */
.mast{padding-block:28px 14px;border-bottom:3px double var(--ink);display:grid;gap:10px}
.mast h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,8.5vw,6.2rem);line-height:.92;letter-spacing:-.02em}
.mast h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.mast .meta{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;color:var(--muted)}
.mast .meta b{color:var(--ink)}
.mast select{font:inherit;font-family:var(--f-label);font-size:.95rem;background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:4px 8px}

/* copertina */
.cover{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:36px;padding-block:28px 36px;border-bottom:1px solid var(--rule)}
.cover-main{min-width:0}
.cover-fig{margin:0;position:relative}
.cover-fig img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--paper-2)}
.cover-fig figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}
.kick{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kick .sec{color:var(--sc,var(--accent));font-weight:700}
.kick .tag{color:var(--muted)}
.cover h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,6vw,4.4rem);line-height:.98;letter-spacing:-.015em;margin:14px 0 14px}
.cover h2 a{text-decoration:none}
.cover h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.cover .stand{font-size:1.2rem;line-height:1.5;max-width:60ch;margin:0;color:var(--ink)}
.toc{min-width:0;border-left:1px solid var(--rule);padding-left:28px}
.toc h3{margin:0 0 12px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.95rem;border-bottom:2px solid var(--ink);padding-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
.toc li a{display:grid;gap:2px;padding-block:12px;border-bottom:1px solid var(--rule);text-decoration:none}
.toc li a:hover .t{text-decoration:underline}
.toc .s{color:var(--sc);font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}
.toc .t{font-family:var(--f-display);font-weight:700;font-size:1.22rem;line-height:1.15}
.toc .d{color:var(--muted);font-size:.92rem;line-height:1.4}

/* sezioni */
.band{padding-block:34px;border-bottom:1px solid var(--rule)}
.band-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:3px solid var(--ink);padding-top:8px;margin-bottom:20px}
.band-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:-.01em}
.band-h span{color:var(--muted)}

.brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;margin:0;padding:0;list-style:none}
.brief li{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:14px;padding-block:14px;border-bottom:1px solid var(--rule)}
.brief .day{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-size:.95rem;padding-top:2px;font-variant-numeric:tabular-nums}
.brief h3{margin:0 0 4px;font-family:var(--f-body);font-weight:600;font-size:1.04rem;line-height:1.3}
.brief p{margin:0;font-size:.95rem;line-height:1.5;color:var(--muted)}
.brief a{text-decoration-color:var(--rule);text-underline-offset:3px}
.brief a:hover{text-decoration-color:currentColor}

.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0;padding:0;list-style:none}
.nums li{padding:18px 22px 20px 0;border-bottom:1px solid var(--rule)}
.nums .n{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,5vw,3.4rem);line-height:1;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.nums .n small{font-family:var(--f-label);font-size:1rem;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-left:6px;text-transform:uppercase}
.nums p{margin:8px 0 0;font-size:.95rem;line-height:1.45;max-width:32ch}

/* articoli */
.art{padding-block:46px;border-bottom:1px solid var(--rule);scroll-margin-top:12px}
.art-head{max-width:880px}
.art h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,5vw,3.5rem);line-height:1;letter-spacing:-.015em;margin:12px 0 14px}
.art .stand{font-size:1.18rem;line-height:1.5;margin:0 0 14px;max-width:62ch}
.byline{color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.share{font:inherit;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:.82rem;background:none;border:1px solid var(--rule);color:var(--ink);border-radius:3px;padding:3px 9px;cursor:pointer}
.share:hover{border-color:var(--ink)}
.art figure{margin:24px 0 0}
.art figure img{display:block;width:100%;aspect-ratio:21/9;object-fit:cover;background:var(--paper-2)}
.art figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}
.art-body{display:grid;grid-template-columns:minmax(0,65ch) minmax(0,1fr);gap:48px;margin-top:28px}
.text{min-width:0}
.text p{margin:0 0 1.05em}
.text > p:first-of-type::first-letter{font-family:var(--f-display);font-weight:800;float:left;font-size:4.1em;line-height:.82;padding:.06em .1em 0 0;color:var(--sc,var(--accent))}
.text h3{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:1.02rem;margin:1.7em 0 .5em;color:var(--sc,var(--accent))}
.side{min-width:0;display:grid;align-content:start;gap:28px}
.pull{margin:0;padding-top:14px;border-top:3px solid var(--sc,var(--accent));font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.5rem;line-height:1.25}
.src h4{margin:0 0 8px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:.85rem;color:var(--muted)}
.src ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:.88rem;line-height:1.35}
.src a{text-decoration-color:var(--rule);text-underline-offset:3px}
.src a:hover{text-decoration-color:currentColor}

.art.op{background:var(--op-bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:none}
.art.op .inner{max-width:1180px;margin:0 auto}
.art.op h2{font-style:italic;font-weight:700}

.soc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.soc article{min-width:0;border-top:1px solid var(--rule);padding-top:12px;scroll-margin-top:12px}
.soc .label{color:var(--c-soc)}
.soc h3{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.12;margin:6px 0 10px}
.soc p{margin:0 0 .8em;font-size:.97rem}
.soc .src{margin-top:10px}

.watch{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:0 28px}
.watch li{padding-block:12px;border-bottom:1px solid var(--rule)}
.watch .when{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-size:.9rem}
.watch p{margin:4px 0 0;font-size:.97rem;line-height:1.45}

footer{padding-block:34px 48px;color:var(--muted);font-size:.88rem;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px}
footer h4{margin:0 0 8px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:.85rem;color:var(--ink)}
footer p{margin:0 0 .7em}
footer ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
footer a{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-family:var(--f-label);letter-spacing:.05em;font-size:.95rem}

@media (max-width:900px){
  .cover{grid-template-columns:minmax(0,1fr)}
  .toc{border-left:none;padding-left:0}
  .art-body{grid-template-columns:minmax(0,1fr);gap:8px}
  .side{order:-1;margin-bottom:12px}
  .side .src{order:2}
  .soc{grid-template-columns:minmax(0,1fr)}
  footer{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .brief{grid-template-columns:minmax(0,1fr)}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .art figure img{aspect-ratio:3/2}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0}

/* copertina: numero, tempo di lettura, leggi tutto */
.cover-fig .issue{position:absolute;top:0;left:0;background:var(--accent);color:var(--on-photo);font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px;line-height:1.05;text-align:center}
.cover-fig .issue b{display:block;font-family:var(--f-display);font-size:2.3rem;letter-spacing:0;font-weight:800}
:root[data-theme="dark"] .cover-fig .issue{color:#0d1a1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover-fig .issue{color:#0d1a1d}}
.cover-cta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:20px}
.btn{display:inline-block;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.95rem;background:var(--ink);color:var(--paper);text-decoration:none;padding:9px 16px;border-radius:3px}
.btn:hover{background:var(--accent)}
.cover-cta .label{color:var(--muted)}
.toc .d .m{white-space:nowrap}

/* brevi: la fonte originale in fondo */
.brief .who{font-family:var(--f-label);font-weight:600;letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.brief .who a{text-decoration:none;color:var(--accent)}
.brief .who a:hover{text-decoration:underline}

/* fonti: il link al quotidiano */
.src .q{font-family:var(--f-label);font-weight:600;letter-spacing:.04em;color:var(--accent);text-decoration:none;white-space:nowrap}
.src .q:hover{text-decoration:underline}

/* un'altra lettura */
.counter{margin:1.6em 0 0;border:1px solid var(--rule);border-left:4px solid var(--c-sec);background:var(--paper);padding:16px 20px}
.counter h3{margin:0 0 .5em !important;color:var(--c-sec) !important}
.counter p{margin:0 0 .8em}
.counter p:last-child{margin:0}
.counter .note{font-size:.85rem;color:var(--muted)}

/* indice dell'articolo e barra di avanzamento */
.side-toc{position:sticky;top:56px}
.side-toc h4{margin:0 0 8px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:.85rem;color:var(--muted)}
.side-toc ol{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.92rem;line-height:1.35}
.side-toc a{text-decoration:none;border-left:2px solid var(--rule);padding-left:10px;display:block;color:var(--muted)}
.side-toc a:hover,.side-toc a[aria-current="true"]{color:var(--ink);border-left-color:var(--sc,var(--accent))}
.text h3{scroll-margin-top:56px}
.progress{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);font-family:var(--f-label);font-size:.88rem;letter-spacing:.04em;color:var(--muted);padding:7px max(16px,env(safe-area-inset-left,0px)) 8px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
.progress .bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--sc,var(--accent));width:0}
.progress .ptxt{display:block;max-width:1180px;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress .ptxt b{color:var(--ink);font-weight:700}
.share[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* dal quotidiano */
.daily{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 28px;margin:0;padding:0;list-style:none}
.daily li{padding-block:12px;border-bottom:1px solid var(--rule)}
.daily a{text-decoration:none;font-weight:600;line-height:1.3;display:block}
.daily a:hover{text-decoration:underline}
.daily .label{color:var(--accent);display:block;margin-bottom:3px}

@media (max-width:900px){.side-toc{display:none}}
@media print{
  :root{--paper:#fff;--paper-2:#fff;--ink:#000;--muted:#333;--rule:#999;--op-bg:#fff}
  body{font-size:10.5pt}
  .about,.progress,.share,.cover-cta .btn,#pick,.side-toc,.toast,.daily-band,.q{display:none !important}
  .cover-fig .issue{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .art{break-before:page;padding-block:0 18px}
  .art figure img{max-height:8cm}
  .brief li,.nums li,.watch li,.soc article,.counter{break-inside:avoid}
  a{text-decoration:none}
}
</style>
</head>
<body>
<div class="progress" id="progress" hidden><div class="bar" id="bar"></div><span class="ptxt" id="ptxt"></span></div>
<div class="wrap">
  <div class="about">
    <span>Un'idea di Carlo, generata da Claude, basata sulla newsletter Daily Brief di PierG</span>
    <a href="../quotidiano/">Leggi Il Quotidiano dell'AI</a>
  </div>
  <header class="mast">
    <h1>Il Settimanale <em>dell'AI</em></h1>
    <div class="meta label" id="meta"><span>Caricamento del numero…</span></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const app=document.getElementById('app'), meta=document.getElementById('meta');
  let DATA=[];
  const DAILY={};   // url di una fonte → data dell'edizione del Quotidiano che la cita
  const BASE=/claude|anthropic/.test(location.hostname)?'https://claude.ai/artifact/HHTyMfdodEP7ddvxxWzwyC':location.href.split('#')[0];
  const SC={"Copertina":"--c-cover","Economia":"--c-econ","Finanza":"--c-fin","Sicurezza":"--c-sec","Il commento":"--c-op","Società":"--c-soc"};
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sc=sec=>`--sc:var(${SC[sec]||'--accent'})`;
  const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
  const fmt=iso=>{const d=new Date(iso+'T12:00:00Z');return `${GIORNI[d.getUTCDay()]} ${d.getUTCDate()} ${MESI[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
  const shortDay=iso=>{const d=new Date(iso+'T12:00:00Z');return `${d.getUTCDate()} ${MESI[d.getUTCMonth()].slice(0,3)}`};
  const words=a=>a.join(' ').split(/\s+/).length;
  const mins=a=>Math.max(1,Math.round(words(a.body)/220));
  const OUTLETS={'techcrunch.com':'TechCrunch','technologyreview.com':'MIT Technology Review','wired.com':'Wired','theverge.com':'The Verge','bloomberg.com':'Bloomberg','reuters.com':'Reuters','ft.com':'Financial Times','nytimes.com':'The New York Times','wsj.com':'Wall Street Journal','cnbc.com':'CNBC','arstechnica.com':'Ars Technica','theinformation.com':'The Information','axios.com':'Axios','semafor.com':'Semafor','forrester.com':'Forrester','x.com':'X','twitter.com':'X','github.com':'GitHub','arxiv.org':'arXiv','substack.com':'Substack','newsletter.pragmaticengineer.com':'The Pragmatic Engineer','theguardian.com':'The Guardian','economist.com':'The Economist','businessinsider.com':'Business Insider','404media.co':'404 Media','venturebeat.com':'VentureBeat','zdnet.com':'ZDNet','engadget.com':'Engadget','fortune.com':'Fortune','openai.com':'OpenAI','anthropic.com':'Anthropic','blog.google':'Google'};
  function outlet(u){
    try{const h=new URL(u).hostname.replace(/^www\./,'');
      if(OUTLETS[h]) return OUTLETS[h];
      const k=Object.keys(OUTLETS).find(d=>h.endsWith('.'+d)); if(k) return OUTLETS[k];
      return h;}catch(_){return ''}
  }
  const dailyLink=u=>DAILY[u]?`<a class="q" href="../quotidiano/#u-${encodeURIComponent(u)}" title="La notizia sul Quotidiano del ${esc(fmt(DAILY[u]))}">nel Quotidiano →</a>`:'';

  function sources(list){
    if(!list||!list.length) return '';
    return `<div class="src"><h4>Per approfondire</h4><ul>${list.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>${DAILY[s.url]?' · '+dailyLink(s.url):''}</li>`).join('')}</ul></div>`;
  }
  const cid=(id,i)=>`${id}-h${i}`;
  function body(paras,id){
    let h=0;
    return paras.map(p=>p.startsWith('## ')?`<h3 id="${cid(id,h++)}">${esc(p.slice(3))}</h3>`:`<p>${esc(p)}</p>`).join('');
  }
  function sideToc(paras,id){
    const hs=paras.filter(p=>p.startsWith('## '));
    if(hs.length<2) return '';
    return `<nav class="side-toc" aria-label="In questo articolo"><h4>In questo articolo</h4><ol>${hs.map((p,i)=>`<li><a href="#${cid(id,i)}" data-toc="${id}">${esc(p.slice(3))}</a></li>`).join('')}</ol></nav>`;
  }
  function counter(c){
    if(!c||!c.body||!c.body.length) return '';
    return `<aside class="counter" aria-label="Un'altra lettura"><h3>Un'altra lettura${c.title?': '+esc(c.title):''}</h3>${c.body.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="note">L'obiezione più forte alla tesi del commento, scritta anche questa da Claude per mettere alla prova il ragionamento.</p></aside>`;
  }
  function photo(p){
    if(!p) return '';
    return `<figure><img src="${esc(p.file)}" alt="${esc(p.alt)}" loading="lazy"><figcaption>${esc(p.caption||'')} Foto: ${esc(p.author)}, ${esc(p.license)}, <a href="${esc(p.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>.</figcaption></figure>`;
  }
  function article(e,a,opts={}){
    const id=`a-${e.date}-${a.id}`;
    const by=opts.byline||'Dalla redazione, sulle newsletter della settimana';
    const listen='speechSynthesis' in window?`<button class="share" type="button" data-listen="${id}" aria-pressed="false">Ascolta</button>`:'';
    const inner=`
      <div class="art-head">
        <div class="kick label"><span class="sec">${esc(a.section)}</span><span class="tag">${esc(a.tag)}</span></div>
        <h2>${esc(a.title)}</h2>
        <p class="stand">${esc(a.standfirst)}</p>
        <div class="byline"><span>${esc(by)}</span><span>${mins(a)} min di lettura</span>${listen}<button class="share" type="button" data-id="${id}">Copia il link</button></div>
      </div>
      ${photo(a.photo)}
      <div class="art-body">
        <div class="text">${body(a.body,id)}${opts.op?counter(a.counter):''}</div>
        <aside class="side">${a.pull?`<blockquote class="pull">${esc(a.pull)}</blockquote>`:''}${sources(a.sources)}${sideToc(a.body,id)}</aside>
      </div>`;
    return `<article class="art${opts.op?' op':''}" id="${id}" data-title="${esc(a.title)}" data-min="${mins(a)}" style="${sc(a.section)}">${opts.op?`<div class="inner">${inner}</div>`:inner}</article>`;
  }

  function dailyBand(e){
    // le notizie del Quotidiano da cui nasce il numero: quelle citate nelle brevi e negli articoli
    const seen=new Set(), out=[];
    const add=(u,t,when)=>{if(DAILY[u]&&!seen.has(u)){seen.add(u);out.push({u,t,when:DAILY[u]})}};
    for(const b of e.brief) add(b.url,b.title);
    for(const a of [e.cover,...e.features,e.opinion,...e.society]) for(const s of a.sources||[]) add(s.url,s.label.replace(/^[^—]+—\s*/,''));
    if(!out.length) return '';
    out.sort((a,b)=>a.when.localeCompare(b.when));
    return `<section class="band daily-band">
        <div class="band-h"><h2>Giorno per giorno</h2><span class="label">Le notizie da cui nasce questo numero, sul Quotidiano</span></div>
        <ul class="daily">${out.slice(0,12).map(x=>`<li><a href="../quotidiano/#u-${encodeURIComponent(x.u)}"><span class="label">${esc(fmt(x.when))}</span>${esc(x.t)}</a></li>`).join('')}</ul>
      </section>`;
  }

  function render(e, scrollTo){
    const all=[e.cover,...e.features,e.opinion];
    const total=all.reduce((n,a)=>n+mins(a),0)+Math.max(1,Math.round(words([...e.brief.map(b=>b.title+' '+b.text),...e.society.flatMap(s=>s.body)])/220));
    meta.innerHTML=`<span><b>Numero ${e.n}</b></span><span>${esc(fmt(e.date))}</span><span>Settimana ${esc(e.range)}</span>`+
      (DATA.length>1?`<label for="pick" class="label">Archivio <select id="pick">${DATA.map(x=>`<option value="${x.date}"${x.date===e.date?' selected':''}>N. ${x.n} · ${esc(x.range)}</option>`).join('')}</select></label>`:'');
    const c=e.cover;
    const tocItems=[...all.map(a=>({id:a.id,s:a.section,t:a.title,d:a.tag,m:mins(a)})),{id:'societa',s:'Società',t:e.society.map(x=>x.title).slice(0,2).join(' · '),d:'Tre storie brevi'}];
    app.innerHTML=`
      <section class="cover" style="${sc('Copertina')}">
        <div class="cover-main">
          ${c.photo?`<figure class="cover-fig"><img src="${esc(c.photo.file)}" alt="${esc(c.photo.alt)}"><span class="issue" aria-hidden="true">N.<b>${esc(e.n)}</b>${esc(shortDay(e.date))}</span><figcaption>${esc(c.photo.caption)} Foto: ${esc(c.photo.author)}, ${esc(c.photo.license)}, <a href="${esc(c.photo.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>.</figcaption></figure>`:''}
          <div class="kick label" style="margin-top:18px"><span class="sec">Storia di copertina</span><span class="tag">${esc(c.tag)}</span></div>
          <h2><a href="#a-${e.date}-${c.id}">${esc(c.title)}</a></h2>
          <p class="stand">${esc(c.standfirst)}</p>
          <div class="cover-cta"><a class="btn" href="#a-${e.date}-${c.id}">Leggi tutto il numero</a><span class="label">Si legge in circa ${total} minuti · ${all.length} articoli, ${e.brief.length} brevi</span></div>
        </div>
        <nav class="toc" aria-label="In questo numero">
          <h3>In questo numero</h3>
          <ol>${tocItems.map(x=>`<li><a href="#a-${e.date}-${x.id}" style="${sc(x.s)}"><span class="s">${esc(x.s)}</span><span class="t">${esc(x.t)}</span><span class="d">${esc(x.d)}${x.m?` · <span class="m">${x.m} min</span>`:''}</span></a></li>`).join('')}
          <li><a href="#a-${e.date}-breve" style="${sc('')}"><span class="s">La settimana in breve</span><span class="t">${e.brief.length} notizie in poche righe</span></a></li></ol>
        </nav>
      </section>

      <section class="band" id="a-${e.date}-breve">
        <div class="band-h"><h2>La settimana in breve</h2><span class="label">${esc(e.range)}</span></div>
        <ul class="brief">${e.brief.map(b=>{const o=b.source||(b.url?outlet(b.url):'');return `<li><span class="day">${esc(b.day)}</span><div><h3>${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a>`:esc(b.title)}</h3><p>${esc(b.text)}${o?` <span class="who">— ${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(o)}</a>`:esc(o)}</span>`:''}${DAILY[b.url]?` · ${dailyLink(b.url)}`:''}</p></div></li>`}).join('')}</ul>
      </section>

      <section class="band">
        <div class="band-h"><h2>I numeri della settimana</h2></div>
        <ul class="nums">${e.numbers.map(x=>`<li><div class="n">${esc(x.n)}${x.of?`<small>${esc(x.of)}</small>`:''}</div><p>${esc(x.label)}</p></li>`).join('')}</ul>
      </section>

      ${article(e,c)}
      ${e.features.map(a=>article(e,a)).join('')}
      ${article(e,e.opinion,{op:true,byline:e.opinion.byline})}

      <section class="band" id="a-${e.date}-societa">
        <div class="band-h"><h2>Società</h2><span class="label">L'AI fuori dagli uffici</span></div>
        <div class="soc">${e.society.map(s=>`<article id="a-${e.date}-${s.id}"><span class="label">${esc(s.tag)}</span><h3>${esc(s.title)}</h3>${s.body.map(p=>`<p>${esc(p)}</p>`).join('')}${sources(s.sources)}</article>`).join('')}</div>
      </section>

      <section class="band">
        <div class="band-h"><h2>Da tenere d'occhio</h2><span class="label">La prossima settimana</span></div>
        <ul class="watch">${e.watch.map(w=>`<li><span class="when">${esc(w.when)}</span><p>${esc(w.text)}</p></li>`).join('')}</ul>
      </section>

      ${dailyBand(e)}

      <footer>
        <div>
          <h4>Chi siamo</h4>
          <p>Il Settimanale dell'AI è un'idea di Carlo, generata da Claude e basata sulla newsletter Daily Brief di PierG. Ogni numero rilegge le newsletter della settimana, sceglie i temi che tornano più spesso e li racconta in approfondimenti. Il commento è un'analisi di Claude e lo dichiara, e sotto ha sempre un'altra lettura che ne mette alla prova la tesi.</p>
          <p>I fatti vengono dalle newsletter e dalle fonti citate in fondo a ogni pezzo. Le notizie di ogni giorno sono su <a href="../quotidiano/">Il Quotidiano dell'AI</a>. Per ricevere il Daily Brief, chiedi a PierG. Per seguire il Settimanale con un lettore di notizie c'è il <a href="feed.xml">feed RSS</a>; per leggerlo su carta, stampa la pagina.</p>
        </div>
        <div>
          <h4>Foto di questo numero</h4>
          <ul>${all.filter(a=>a.photo).map(a=>`<li>${esc(a.title)}: ${esc(a.photo.author)}, ${esc(a.photo.license)}, <a href="${esc(a.photo.page)}" target="_blank" rel="noopener">Wikimedia Commons</a></li>`).join('')}</ul>
        </div>
      </footer>`;
    const pick=document.getElementById('pick');
    if(pick) pick.addEventListener('change',()=>{location.hash='n-'+pick.value});
    if(scrollTo){const el=document.getElementById(scrollTo); if(el) el.scrollIntoView();}
    else window.scrollTo(0,0);
    onScroll();
  }

  function route(){
    stopSpeech();
    const h=decodeURIComponent(location.hash.slice(1));
    let m=h.match(/^(?:n|a)-(\d{4}-\d{2}-\d{2})/);
    const e=(m&&DATA.find(x=>x.date===m[1]))||DATA[0];
    if(!e) return;
    const target=h.startsWith('a-')?h:null;
    if(app.dataset.cur===e.date && target){const el=document.getElementById(target); if(el) el.scrollIntoView(); return;}
    app.dataset.cur=e.date; render(e,target);
  }

  /* barra di avanzamento: titolo dell'articolo e minuti che mancano */
  const prog=document.getElementById('progress'), bar=document.getElementById('bar'), ptxt=document.getElementById('ptxt');
  let ticking=false;
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{
      ticking=false;
      const y=window.innerHeight*0.3;
      const art=[...document.querySelectorAll('.art')].find(a=>{const r=a.getBoundingClientRect();return r.top<y&&r.bottom>y});
      if(!art){prog.hidden=true;return}
      const r=art.getBoundingClientRect();
      const f=Math.min(1,Math.max(0,(y-r.top)/r.height));
      const left=Math.max(0,Math.ceil(+art.dataset.min*(1-f)));
      prog.hidden=false; prog.style.cssText=art.getAttribute('style')||'';
      bar.style.width=(f*100).toFixed(1)+'%';
      ptxt.innerHTML=`<b>${esc(art.dataset.title)}</b> · ${left?`mancano ${left} min`:'ultime righe'}`;
      // capitolo in corso nell'indice laterale
      const hs=[...art.querySelectorAll('.text h3')];
      let cur=null; for(const h of hs){ if(h.getBoundingClientRect().top<y) cur=h.id; }
      for(const a of art.querySelectorAll('.side-toc a')) a.setAttribute('aria-current',String(a.getAttribute('href')==='#'+cur));
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});

  /* ascolta */
  function stopSpeech(){
    if('speechSynthesis' in window) speechSynthesis.cancel();
    for(const b of document.querySelectorAll('[data-listen]')){b.setAttribute('aria-pressed','false');b.textContent='Ascolta'}
  }
  function listen(btn){
    if(btn.getAttribute('aria-pressed')==='true'){stopSpeech();return}
    stopSpeech();
    const art=document.getElementById(btn.dataset.listen); if(!art) return;
    const parts=[art.dataset.title, art.querySelector('.stand')?.textContent||'', ...[...art.querySelectorAll('.text > p, .text > h3')].map(n=>n.textContent)];
    const voice=speechSynthesis.getVoices().find(v=>/^it/i.test(v.lang));
    btn.setAttribute('aria-pressed','true'); btn.textContent='Ferma la lettura';
    parts.filter(Boolean).forEach((t,i,arr)=>{
      const u=new SpeechSynthesisUtterance(t); u.lang='it-IT'; if(voice) u.voice=voice;
      if(i===arr.length-1) u.onend=()=>{btn.setAttribute('aria-pressed','false');btn.textContent='Ascolta'};
      speechSynthesis.speak(u);
    });
  }

  const toast=document.getElementById('toast'); let tt;
  function say(t){toast.textContent=t;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2200)}
  document.addEventListener('click',ev=>{
    const l=ev.target.closest('[data-listen]'); if(l){listen(l);return}
    const t=ev.target.closest('[data-toc]');
    if(t){ev.preventDefault();const el=document.getElementById(t.getAttribute('href').slice(1)); if(el) el.scrollIntoView(); return}
    const b=ev.target.closest('.share[data-id]'); if(!b) return;
    const link=BASE+'#'+b.dataset.id;
    try{navigator.clipboard.writeText(link).then(()=>say('Link copiato'),()=>say(link))}catch(_){say(link)}
  });

  // il Quotidiano è facoltativo: se non si carica, il Settimanale funziona lo stesso
  const dailyLoad=fetch('../quotidiano/data/issues.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
    for(const x of ((d&&d.issues)||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)))
      for(const m of (x.markdown||'').matchAll(/\]\((https?:\/\/[^)\s]+)\)/g)) if(!DAILY[m[1]]) DAILY[m[1]]=x.date;
  }).catch(()=>{});

  fetch('data/issues.json',{cache:'no-store'}).then(r=>r.json()).then(async d=>{
    DATA=(d.issues||[]).sort((a,b)=>b.date.localeCompare(a.date));
    await Promise.race([dailyLoad,new Promise(r=>setTimeout(r,1500))]);
    route(); window.addEventListener('hashchange',route);
  }).catch(()=>{meta.innerHTML='<span>Non riesco a caricare il numero. Ricarica la pagina.</span>'});
})();
</script>
</body>
</html>
